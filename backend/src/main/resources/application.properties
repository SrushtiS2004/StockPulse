# StockPulse Configuration

# Server
server.port=8081

# H2 Database
spring.datasource.url=jdbc:h2:mem:stockpulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Commerce Advisor Strategy (ai or rule-based)
commerce.strategy=${COMMERCE_STRATEGY:ai}

# LLM Configuration (LiteLLM / OpenAI compatible)
# Sensitive credentials are safe: read from environment variables or application-secret.properties (ignored by Git)
llm.provider=${LLM_PROVIDER:zycus}
llm.base-url=${LLM_BASE_URL:https://litellm-qc.zycus.net/v1}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:qwen-cursor}
llm.product-header=${LLM_PRODUCT_HEADER:PC1}
llm.cookie=${LLM_COOKIE:}

# Optional Local Secret Imports (ignored in version control)
spring.config.import=optional:classpath:application-secret.properties,optional:file:secret.properties,optional:file:../secret.properties

# Logging
logging.level.com.zycus.stockpulse=INFO
logging.level.org.springframework.web=INFO